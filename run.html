<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hoa Văn Cương Đạo</title>
</head>
<style>
    html, body {
        height: 100%;
    }
    body {
        margin: 0;
        padding: 0;
        font-family: sans;
        background: #eee;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }
    #screen-area {
        background-color: #eee;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #display {
        background-color: white;
        zoom: 1;
        image-rendering: pixelated; /* affects zoom */
        cursor: pointer;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
    }
    #display:focus {
        outline: none;
    }
    #loading {
        font-size: 2em;
    }

    /* Short gesture reminder, shown once when the game screen is ready. */
    #mouse-hint {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px 12px;
        max-width: 92vw;
        box-sizing: border-box;
        padding: 8px 14px;
        border-radius: 14px;
        background: rgba(24, 30, 44, .86);
        color: #dbe6ff;
        font: 13px system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity .25s ease;
    }
    #mouse-hint.show { opacity: 1; }
    #mouse-hint b { color: #fff; font-weight: 600; }
</style>
<body>
    <div id="mouse-hint" aria-hidden="true">
        <span><b>Chuột trái</b> / chạm: đánh, chọn</span>
        <span><b>Giữ chuột phải</b> + kéo / vuốt: di chuyển</span>
        <span><b>Lăn</b>: lên / xuống</span>
        <span><b>Chuột giữa</b> / 2 ngón: quay lại</span>
    </div>
    <div id="screen-area">
        <canvas tabindex="0" id="display" style="display: none;"></canvas>
        <div id="loading">Loading...</div>
    </div>
    <script src="https://cjrtnc.leaningtech.com/20260317_2978/loader.js"></script>
    <script type="module" src="src/main.js?v=6"></script>
</body>
</html>
